<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>제로·저당·단백질 제품 유해성분 검출기</title>
    <meta name="description" content="전성분 표를 찍거나 제품명을 검색하면, 조심해야 할 성분을 찾아드려요." />

    <!-- 링크를 공유하면 카카오톡·메시지가 이 값으로 미리보기를 만든다.
         og:image 원본은 design/og.html — 거기 주석에 다시 뽑는 방법이 있다.
         TODO(배포): og:image 를 https://<도메인>/og.png 처럼 절대 주소로 바꿀 것.
         상대 주소를 못 읽는 크롤러가 있어 썸네일이 빠질 수 있다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="제로·저당·단백질 제품 유해성분 검출기" />
    <meta property="og:description" content="전성분 표를 찍거나 제품명을 검색하면, 조심해야 할 성분을 찾아드려요." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
